name: CI Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  check-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: MyVMSTAT

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: MyVMSTAT
          token: ${{ secrets.PAT || github.token }}

      - name: Checkout common_lib
        uses: actions/checkout@v4
        with:
          repository: tkshnkgwr/common_lib
          path: common_lib
          token: ${{ secrets.PAT || github.token }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check

      - name: Cargo Clippy
        run: cargo clippy -- -D warnings

      - name: Cargo Test
        run: cargo test

      - name: Auto Tagging
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: pwsh
        run: |
          $cargoContent = Get-Content -Path Cargo.toml -Raw
          if ($cargoContent -match '(?m)^version\s*=\s*"([^"]+)"') {
              $version = $Matches[1]
          } else {
              Write-Error "Could not find version in Cargo.toml"
              exit 1
          }
          Write-Output "Found version $version"
          $tagName = "v$version"
          git fetch --tags
          $tagExists = git tag -l $tagName
          if (-not $tagExists) {
              Write-Output "Tag $tagName does not exist. Creating and pushing..."
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git tag $tagName
              git push origin $tagName
          } else {
              Write-Output "Tag $tagName already exists. Skipping."
          }
