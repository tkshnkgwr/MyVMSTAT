name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or ref to release (e.g. v1.3.6)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build and Release (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: MyVMSTAT

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: MyVMSTAT
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Checkout common_lib
        uses: actions/checkout@v7
        with:
          repository: tkshnkgwr/common_lib
          path: common_lib
          token: ${{ secrets.PAT || github.token }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/MyVMSTAT.exe, LICENSE, README.md, README_JA.md -DestinationPath MyVMSTAT-windows-amd64.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: MyVMSTAT/MyVMSTAT-windows-amd64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
