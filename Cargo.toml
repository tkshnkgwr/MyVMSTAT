[package]
name = "MyVMSTAT"
version = "1.3.2"
edition = "2021"
authors = ["AI Studio Developer"]
description = "A dstat-like colorized vmstat simulation written in Rust with Timestamps"
license = "MIT"

[dependencies]
sysinfo = { version = "0.39", optional = true }
chrono = "0.4"
# 共有ライブラリ参照
common_lib = { path = "../common_lib", optional = true }

[features]
default = ["sysinfo", "windows_desktop"]
sysinfo = ["dep:sysinfo"]
windows_desktop = ["dep:common_lib", "common_lib/windows_desktop"]

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true

